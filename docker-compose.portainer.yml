services:
  hermes:
    image: ghcr.io/lpbayliss/hermesbox:latest
    container_name: hermes
    restart: unless-stopped
    init: true
    ports:
      - "${SSH_PORT:-2222}:22"
    environment:
      # Container
      TZ: ${TZ:-UTC}
      HERMES_PASSWORD: ${HERMES_PASSWORD:?must be set}
      GH_PAT: ${GH_PAT:-}
      # LLM providers
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_TOKEN: ${ANTHROPIC_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # Tools
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY:-}
      BROWSERBASE_PROJECT_ID: ${BROWSERBASE_PROJECT_ID:-}
      VOICE_TOOLS_OPENAI_KEY: ${VOICE_TOOLS_OPENAI_KEY:-}
      HONCHO_API_KEY: ${HONCHO_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Gateway
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_HOME_CHANNEL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      # RL training
      TINKER_API_KEY: ${TINKER_API_KEY:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn | grep -q ':22'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - hermes-data:/home/hermes/.hermes
      - claude-data:/home/hermes/.claude
      - workspace:/workspace
      - vault:/vault
      - gh-config:/home/hermes/.config/gh
      - git-config:/home/hermes/.config/git
      - ssh-host-keys:/etc/ssh/keys
      - ssh-user-keys:/home/hermes/.ssh
      - bash-history:/var/lib/bash-history

volumes:
  hermes-data:
  claude-data:
  workspace:
  vault:
  gh-config:
  git-config:
  ssh-host-keys:
  ssh-user-keys:
  bash-history:
