model:
  provider: openrouter
  name: moonshotai/kimi-k2.6

fallback_model:
  provider: openrouter
  model: minimax/minimax-m2.5:free

delegation:
  model: openrouter/google/gemini-3.1-flash-lite-preview

compression:
  enabled: true
  threshold: 0.30
  target_ratio: 0.2
  model: openrouter/openai/gpt-5.4-nano

prompt_caching:
  cache_ttl: 1h

agent:
  max_turns: 60
  reasoning_effort: low

session_reset:
  mode: both
  idle_minutes: 360
  at_hour: 4

browser:
  inactivity_timeout: 300

streaming:
  enabled: true

display:
  streaming: true
